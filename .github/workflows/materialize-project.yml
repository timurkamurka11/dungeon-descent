name: Materialize Dungeon Descent project

on:
  push:
    branches:
      - development
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Restore tracked source tree from local 16bfc6a payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/project-text.tar.gz.b64
          base64 -d /tmp/project-text.tar.gz.b64 > /tmp/project-text.tar.gz
          tar -xzf /tmp/project-text.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-project.yml

      - name: Commit restored source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dungeon Descent Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize Unity project from 16bfc6a"
          git push origin development
