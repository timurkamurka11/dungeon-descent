name: Verify Dungeon Descent transfer

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.issue.title == 'verify-dungeon-descent-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Verify Unity project transfer
        shell: bash
        run: |
          set -euo pipefail

          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"

          test -d Assets
          test -d Packages
          test -d ProjectSettings
          test -f Assets/DungeonDescent/Scenes/Main.unity
          test -f Packages/manifest.json
          test -f ProjectSettings/ProjectVersion.txt
          test -f README.md
          test -f THIRD_PARTY_ASSETS.md
          test -f ARCHITECTURE.md
          test -f GAME_DESIGN.md

          test ! -d Library
          test ! -d Temp
          test ! -d Logs
          test ! -d UserSettings
          test ! -d .bootstrap

          files=$(git ls-files | wc -l | tr -d ' ')
          meta=$(git ls-files '*.meta' | wc -l | tr -d ' ')
          media=$(git ls-files '*.png' '*.wav' | wc -l | tr -d ' ')
          echo "TRACKED_FILES=$files"
          echo "META_FILES=$meta"
          echo "MEDIA_FILES=$media"

          test "$files" -eq 227
          test "$meta" -eq 119
          test "$media" -eq 36

          missing=0
          while IFS= read -r f; do
            case "$f" in
              *.meta) continue ;;
            esac
            if [ ! -f "$f.meta" ]; then
              echo "MISSING_META=$f.meta"
              missing=1
            fi
          done < <(git ls-files 'Assets/**')
          test "$missing" -eq 0

          while IFS= read -r f; do
            test -s "$f"
          done < <(git ls-files '*.meta')

          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(
              ['git', 'ls-files', '*.png', '*.wav'], text=True
          ).splitlines()
          assert len(paths) == 36, len(paths)

          expected_empty = Path('Assets/DungeonDescent/Resources/Textures/wood_albedo.png')
          assert expected_empty.exists()
          assert expected_empty.stat().st_size == 0

          for raw in paths:
              p = Path(raw)
              if p == expected_empty:
                  continue
              data = p.read_bytes()
              assert data, f'empty media: {p}'
              if p.suffix.lower() == '.png':
                  assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'bad PNG: {p}'
              elif p.suffix.lower() == '.wav':
                  assert data[:4] == b'RIFF' and data[8:12] == b'WAVE', f'bad WAV: {p}'

          print('MEDIA_SIGNATURES=PASS')
          PY

          grep -q '^\[Ll\]ibrary/' .gitignore
          grep -q '^\[Tt\]emp/' .gitignore
          grep -q '^\[Ll\]ogs/' .gitignore

          echo 'TRANSFER_VERIFY=PASS'
