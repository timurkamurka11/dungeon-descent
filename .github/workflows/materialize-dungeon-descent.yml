name: Materialize Dungeon Descent from local 16bfc6a

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.issue.title == 'materialize-dungeon-descent-16bfc6a'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development bootstrap
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Restore exact tracked text tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/project-text.tar.gz.b64
          base64 -d /tmp/project-text.tar.gz.b64 > /tmp/project-text.tar.gz
          tar -xzf /tmp/project-text.tar.gz -C .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore project-owned binary assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'Pillow==12.3.0'
          mkdir -p Assets/DungeonDescent/Art/Icons
          python tools/generate_art.py
          # Preserve the exact tracked 16bfc6a state for this one resource file.
          : > Assets/DungeonDescent/Resources/Textures/wood_albedo.png

      - name: Remove transfer-only files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-project.yml

      - name: Commit complete Unity project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dungeon Descent Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: materialize complete Unity project from 16bfc6a'
          git push origin development
